server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    # Set no-cache for the version, config and index.html
    # so that browsers always check for a new copy of Element Web.
    # NB http://your-domain/ and http://your-domain/? are also covered by this

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /version {
        add_header Cache-Control "no-cache";
    }

    # для проксирования к конферуму
;     location /bigbluebutton/api/ {
;         proxy_pass https://conferoom.ru/bigbluebutton/api/;
;         proxy_set_header Host $host;
;         proxy_set_header X-Real-IP $remote_addr;
;         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
;         proxy_set_header X-Forwarded-Proto $scheme;
;
;         # Добавляем заголовки CORS
;         add_header 'Access-Control-Allow-Origin' '*';
;         add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
;         add_header 'Access-Control-Allow-Headers' 'Content-Type';
;     }

    # covers config.json and config.hostname.json requests as it is prefix.
    location /config {
        add_header Cache-Control "no-cache";
    }
    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
}

